; ============================================================
;  PlatformIO-Projekt: ESP32-Gateway fuer CC2510-ESL
;  ESP32 <-> (WiFi/MQTT) <-> Home Assistant
;  ESP32 <-> (SPI) <-> nRF24L01+PA+LNA <-> (Funk) <-> CC2510-Tags
; ============================================================

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework  = arduino
monitor_speed = 115200

lib_deps =
    nrf24/RF24@^1.4.11          ; TMRh20 RF24-Bibliothek fuer den nRF24L01
    knolleary/PubSubClient@^2.8 ; MQTT-Client

; PubSubClient-Puffer vergroessern (Standard 256 B ist fuer Bilddaten zu klein).
; Besser: Bild per HTTP ziehen oder in kleinen MQTT-Haeppchen uebertragen
; (siehe README). Dieser Wert ist nur ein grosszuegiger Startpunkt.
build_flags =
    -D MQTT_MAX_PACKET_SIZE=2048
