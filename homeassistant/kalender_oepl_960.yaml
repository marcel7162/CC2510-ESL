# =============================================================================
#  9,7" (960x672) - Kalenderblock (rechte Haelfte) fuer OEPL drawcustom
# -----------------------------------------------------------------------------
#  Ersetzt im Layout alles ab dem schwarzen "Termine"-Balken (rectangle
#  x_start: 482 / y_start: 80) bis zum Ende. Braucht sensor.kalender_termine
#  aus kalender_termine.yaml.
#  8 Zeilen a 66 px: Datum (rot) | Uhrzeit oder "Ganztaegig" | Titel
#  (Muell = rot, sonst schwarz) | Trennlinie.
#  Generiert - Aenderungen am besten im Generator-Muster fuer alle 8 Slots.
# =============================================================================
- type: rectangle
  x_start: 482
  y_start: 80
  x_end: 960
  y_end: 124
  fill: black
- type: icon
  value: calendar-month
  x: 500
  'y': 102
  size: 30
  color: white
  anchor: lm
- type: text
  value: Termine
  x: 536
  'y': 102
  size: 30
  font: ppb.ttf
  color: white
  anchor: lm
- type: text
  value: >-
    {% set n = states('sensor.kalender_termine') | int(0) %}{{ n }} {{ 'Eintrag' if n == 1 else 'Eintraege' }}
  x: 940
  'y': 102
  size: 20
  color: white
  anchor: rm
- type: text
  value: >-
    {% set ev = state_attr('sensor.kalender_termine','events') %}{{ '' if ev else 'Keine Termine' }}
  x: 500
  'y': 152
  size: 24
  color: black
  anchor: lm
# ---- Termin 1 ----
- type: text
  value: >-
    {% set ev = state_attr('sensor.kalender_termine','events') %}{% if ev and ev|length > 0 %}{% set d = ev[0].start | as_datetime | as_local %}{{ ['Mo','Di','Mi','Do','Fr','Sa','So'][d.weekday()] }}, {{ d.strftime('%d.%m.') }}{% endif %}
  x: 500
  'y': 152
  size: 20
  color: red
  anchor: lm
- type: text
  value: >-
    {% set ev = state_attr('sensor.kalender_termine','events') %}{% if ev and ev|length > 0 %}{% if ev[0].all_day %}Ganztaegig{% else %}{{ (ev[0].start | as_datetime | as_local).strftime('%H:%M') }} - {{ (ev[0].end | as_datetime | as_local).strftime('%H:%M') }}{% endif %}{% endif %}
  x: 940
  'y': 152
  size: 18
  color: black
  anchor: rm
- type: text
  value: >-
    {% set ev = state_attr('sensor.kalender_termine','events') %}{% if ev and ev|length > 0 and ev[0].src != 'muell' %}{{ ev[0].summary[:34] }}{% endif %}
  x: 500
  'y': 178
  size: 24
  font: ppb.ttf
  color: black
  anchor: lm
- type: text
  value: >-
    {% set ev = state_attr('sensor.kalender_termine','events') %}{% if ev and ev|length > 0 and ev[0].src == 'muell' %}{{ ev[0].summary[:34] }}{% endif %}
  x: 500
  'y': 178
  size: 24
  font: ppb.ttf
  color: red
  anchor: lm
- type: line
  x_start: 500
  x_end: 940
  y_start: 198
  y_end: 198
  fill: black
  width: 1
