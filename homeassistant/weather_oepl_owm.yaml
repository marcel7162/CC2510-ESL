# =============================================================================
#  PriceTag - OpenEPaperLink Wetterdisplay mit OpenWeatherMap
# -----------------------------------------------------------------------------
#  Rendert in Home Assistant ein 296x152-BWR-Wetterbild und schickt es per
#  open_epaper_link.drawcustom an den Tag (ueber den PriceTag-OEPL-Shim auf dem
#  ESP32, der sich als OEPL-Accesspoint ausgibt).
#
#  HA rendert das Bild -> der Shim quantisiert es zu Schwarz/Weiss/Rot und funkt
#  es per nRF24 zum CC2510-Tag. Panel laut Shim: hwType 0x56 = 2,66" 296x152 BWR.
#
#  VOR DEM EINFUEGEN die drei Werte unter "variables" anpassen.
#  Ablage: Einstellungen -> Automationen -> Neue Automation -> 3-Punkte-Menue
#  -> "In YAML bearbeiten", kompletten Inhalt einfuegen. Oder in automations.yaml.
#
#  Voraussetzungen:
#   - OpenEPaperLink-Integration installiert und auf den Shim gezeigt
#     (AP-Host z.B. pricetag-ap.local), Tag enrollt.
#   - OpenWeatherMap-Integration eingerichtet (liefert die weather.*-Entity).
# =============================================================================

alias: PriceTag Wetter (OpenWeatherMap)
description: Wetter von OpenWeatherMap auf das OEPL-Preisschild rendern
mode: single

triggers:
  - trigger: time_pattern
    minutes: "/15"            # alle 15 Minuten aktualisieren
  - trigger: homeassistant
    event: start

variables:
  tag_entity: open_epaper_link.0000021EADBEEF00   # <-- deine Tag-Entity (Einstellungen -> Geraete -> dein Tag)
  weather_entity: weather.openweathermap          # <-- deine OpenWeatherMap-Wetter-Entity
  city: "Dortmund"                                 # <-- Anzeigename im Banner

actions:
  # 1) Tages-Vorhersage holen (fuer Hoch/Tief)
  - action: weather.get_forecasts
    data:
      type: daily
    target:
      entity_id: "{{ weather_entity }}"
    response_variable: fc

  # 2) Bild rendern + an den Tag schicken
  - action: open_epaper_link.drawcustom
    target:
      entity_id: "{{ tag_entity }}"
    data:
      background: white
      rotate: 0
      payload:
        # --- Banner (rote Leiste): Ort links, Wochentag + Uhr rechts ---
        - type: rectangle
          x_start: 0
          y_start: 0
          x_end: 296
          y_end: 28
          fill: red
          outline: red
        - type: text
          value: "{{ city }}"
          x: 6
          y: 4
          size: 20
          color: white
        - type: text
          value: "{{ ['Mo','Di','Mi','Do','Fr','Sa','So'][now().weekday()] }} {{ now().strftime('%H:%M') }}"
          x: 290
          y: 4
          size: 20
          color: white
          anchor: rt

        # --- Grosse Temperatur (schwarz) ---
        - type: text
          value: "{% set t = state_attr(weather_entity,'temperature') %}{{ '%.0f'|format(t) if t is not none else '--' }}°C"
          x: 6
          y: 38
          size: 46
          color: black

        # --- Zustand (rot) ---
        - type: text
          value: "{% set c = states(weather_entity) %}{% set m = {'sunny':'Klar','clear-night':'Klar','partlycloudy':'Heiter','cloudy':'Bewölkt','fog':'Nebel','rainy':'Regen','pouring':'Starkregen','snowy':'Schnee','snowy-rainy':'Schneeregen','lightning':'Gewitter','lightning-rainy':'Gewitter','hail':'Hagel','windy':'Windig','windy-variant':'Windig','exceptional':'Extrem'} %}{{ m.get(c, c) }}"
          x: 6
          y: 100
          size: 24
          color: red

        # --- Gefuehlt (klein, schwarz) - faellt weg, wenn die Entity es nicht liefert ---
        - type: text
          value: "{% set a = state_attr(weather_entity,'apparent_temperature') %}{{ ('gefühlt ' ~ (a|round(0)|int) ~ '°') if a is not none else '' }}"
          x: 6
          y: 132
          size: 16
          color: black

        # --- Wetter-Icon oben rechts (Sonne/Nacht in Rot, Rest Schwarz) ---
        - type: icon
          value: "{% set c = states(weather_entity) %}{% set m = {'sunny':'mdi:weather-sunny','clear-night':'mdi:weather-night','partlycloudy':'mdi:weather-partly-cloudy','cloudy':'mdi:weather-cloudy','fog':'mdi:weather-fog','rainy':'mdi:weather-rainy','pouring':'mdi:weather-pouring','snowy':'mdi:weather-snowy','snowy-rainy':'mdi:weather-snowy-rainy','lightning':'mdi:weather-lightning','lightning-rainy':'mdi:weather-lightning-rainy','hail':'mdi:weather-hail','windy':'mdi:weather-windy','windy-variant':'mdi:weather-windy-variant','exceptional':'mdi:weather-cloudy-alert'} %}{{ m.get(c, 'mdi:weather-cloudy') }}"
          x: 236
          y: 38
          size: 54
          color: "{% set c = states(weather_entity) %}{{ 'red' if c in ['sunny','clear-night'] else 'black' }}"

        # --- Rechte Spalte: Hoch / Tief (aus der Tages-Vorhersage) ---
        - type: text
          value: "H {% set f = (fc[weather_entity]['forecast'][0]) if (fc is defined and weather_entity in fc and fc[weather_entity]['forecast']|length > 0) else none %}{{ (f['temperature']|round(0)|int) if (f and f['temperature'] is defined) else '--' }}°"
          x: 182
          y: 86
          size: 18
          color: black
        - type: text
          value: "T {% set f = (fc[weather_entity]['forecast'][0]) if (fc is defined and weather_entity in fc and fc[weather_entity]['forecast']|length > 0) else none %}{{ (f['templow']|round(0)|int) if (f and f['templow'] is defined) else '--' }}°"
          x: 182
          y: 108
          size: 18
          color: black

        # --- Feuchte + Wind ---
        - type: text
          value: "{% set h = state_attr(weather_entity,'humidity') %}{% set w = state_attr(weather_entity,'wind_speed') %}{{ (h|int) if h is not none else '--' }}%  {{ (w|round(0)|int) if w is not none else '--' }} km/h"
          x: 182
          y: 132
          size: 16
          color: black
